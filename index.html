<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Beloved Films - we find stories worth watching. Independent film screenings and Beloved Film Club, a monthly film night at Moylett's in Clapton.">
    <meta name="author" content="Beloved Films">
    <link rel="canonical" href="https://www.belovedfilms.co.uk/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Beloved Films">
    <meta property="og:title" content="Beloved Films">
    <meta property="og:description" content="We find stories worth watching. Independent film screenings and a monthly film club in Clapton.">
    <meta property="og:url" content="https://www.belovedfilms.co.uk/">
    <meta property="og:image" content="https://www.belovedfilms.co.uk/assets/images/share.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Beloved Films logo">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preload" href="assets/fonts/script_alt-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/all_caps-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/site.css">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
        }

        .home-nav {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10;
            display: flex;
            gap: 3.5rem;
            background-color: #FCF8F1;
            padding: 0.2rem 0.9rem 0;
            border-radius: 3px;
        }

        .nav-link {
            font-size: 2.5rem;
            color: #4f4e4e;
            text-decoration: none;
            font-family: 'Font All Caps', 'Georgia', serif;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        /* Centre card carrying the message */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 720px);
            padding: 2.5rem 2rem 2.25rem;
            text-align: center;
            background-color: #FCF8F1;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(13, 12, 12, 0.35);
            z-index: 5;
            animation: rise 1.2s ease-out 0.2s both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translate(-50%, calc(-50% + 24px)); }
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }

        .brand-logo {
            display: block;
            width: 300px;
            max-width: 100%;
            height: auto;
        }

        .tagline {
            font-size: 2.5rem;
            color: #0223C6;
            font-weight: normal;
            line-height: 1.2;
            font-family: 'Font Script Alt', sans-serif;
        }

        .contact-items {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-icon {
            width: 24px;
            height: 24px;
            fill: #0223C6;
            flex-shrink: 0;
        }

        .contact-link {
            font-size: 1.6rem;
            color: #4f4e4e;
            text-decoration: none;
            font-family: 'Font All Caps', 'Georgia', serif;
            padding-top: 3px;
        }

        .contact-link:hover {
            text-decoration: underline;
        }

        /* Splash screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background-color: #0d0c0c;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .splash-video {
            max-width: 90%;
            max-height: 90%;
        }

        /* Poster wall: two tilted rows of stills drifting in opposite directions */
        .wall {
            position: fixed;
            inset: -25%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.5rem;
            transform: rotate(-8deg);
            z-index: 1;
        }

        .wall-row {
            display: flex;
            gap: 1.5rem;
            width: max-content;
            padding-right: 1.5rem;
            animation: drift 120s linear infinite;
        }

        .wall-row.reverse {
            animation-direction: reverse;
            animation-duration: 150s;
        }

        .wall:hover .wall-row {
            animation-play-state: paused;
        }

        .still {
            height: 38vh;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 3px;
            box-shadow: 0 6px 24px rgba(13, 12, 12, 0.18);
            filter: saturate(0.9);
            cursor: none;
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .still:hover {
            transform: scale(1.06) rotate(1.5deg);
            filter: saturate(1.1);
        }

        @media (max-width: 768px) {
            .home-nav {
                top: 1rem;
                right: 1rem;
                padding: 0.1rem 0.6rem 0;
                gap: 2rem;
            }

            .container { padding: 1.5rem 1.25rem; }
            .bottom-section { gap: 1rem; }
            .brand-logo { width: 190px; }

            .contact-items {
                gap: 1rem;
                flex-direction: column;
                align-items: center;
            }

            .contact-link { font-size: 1.3rem; }

            .still { height: 36vh; }
            .wall { gap: 26vh; }
            .wall-row { gap: 1rem; padding-right: 1rem; }
        }

        @media (max-width: 480px) {
            .nav-link { font-size: 1.5rem; }
            .tagline { font-size: 2rem; }

            .contact-link {
                font-size: 1.3rem;
                padding-top: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .wall-row { animation: none; }
            .container { animation: none; }
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <video class="splash-video" muted playsinline preload="none" aria-hidden="true"></video>
    </div>
    <script>
        // Show the intro at most once every 7 days, and never to visitors who prefer reduced motion;
        // add ?intro to the URL to force it
        (function() {
            const KEY = 'belovedIntroShown';
            const WEEK = 7 * 24 * 60 * 60 * 1000;
            const splash = document.getElementById('splashScreen');
            const video = splash.querySelector('video');
            const forced = location.search.includes('intro');
            let show = forced || !matchMedia('(prefers-reduced-motion: reduce)').matches;
            try {
                const last = Number(localStorage.getItem(KEY));
                if (!forced && last && Date.now() - last < WEEK) show = false;
                if (show) localStorage.setItem(KEY, Date.now());
            } catch (e) {}

            if (!show) {
                splash.remove();
                return;
            }

            function hide() {
                if (splash.classList.contains('fade-out')) return;
                splash.classList.add('fade-out');
                setTimeout(function() { splash.remove(); }, 500);
            }

            video.addEventListener('ended', hide);
            video.addEventListener('error', hide);
            // Never hold visitors longer than this, e.g. on a slow connection
            setTimeout(hide, 10000);

            video.muted = true;
            video.src = 'assets/images/intro.mp4';
            // Autoplay can be refused (e.g. iPhone Low Power Mode); skip the intro then
            video.play().catch(hide);
        })();
    </script>

    <div class="wall" id="wall" aria-hidden="true">
        <div class="wall-row" data-stills="13 16 15 12 18 14 11 17 08"></div>
        <div class="wall-row reverse" data-stills="21 22 24 23 19 25 27 26 20"></div>
    </div>

    <nav class="home-nav">
        <a href="/film-club/" class="nav-link">Film Club</a>
        <a href="/past-events/" class="nav-link">Past Events</a>
    </nav>

    <main class="container">
        <div class="bottom-section">
            <img src="assets/images/pink_logotype.png" alt="Beloved Films" class="brand-logo">
            <h1 class="tagline">We find stories worth watching</h1>
            <div class="contact-items">
                <div class="contact-item">
                    <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <a href="mailto:hello@belovedfilms.co.uk" class="contact-link" aria-label="Email us at hello@belovedfilms.co.uk">hello@belovedfilms.co.uk</a>
                </div>

                <div class="contact-item">
                    <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                    <a href="https://www.instagram.com/belovedfilms.uk" class="contact-link" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">belovedfilms.uk</a>
                </div>
            </div>
        </div>
    </main>

    <div class="grain" aria-hidden="true"></div>

    <script>
        // Build the poster wall; each row's set is doubled so the drift loops seamlessly
        document.querySelectorAll('.wall-row').forEach(function(row) {
            const ids = row.dataset.stills.split(' ');
            for (let pass = 0; pass < 2; pass++) {
                ids.forEach(function(id) {
                    const img = document.createElement('img');
                    img.src = 'assets/images/web/still-' + id + '.webp';
                    img.alt = '';
                    img.className = 'still';
                    img.decoding = 'async';
                    row.appendChild(img);
                });
            }
        });
    </script>
</body>
</html>
